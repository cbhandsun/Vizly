name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  health:
    name: Types, lint, storage and builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - name: Setup npm
        run: node scripts/bootstrap-ci-npm.mjs
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Prove negative test, type and lint enforcement
        run: node scripts/verify-ci-negative-gates.mjs
      - name: Permission regression
        run: npm run test:rls
      - name: Real storage regression
        run: npm run test:s3
      - name: Build application
        run: npm run build
      - name: Build collaboration backend
        run: npm run collaboration:build

  tests:
    name: Full application tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - name: Setup npm
        run: node scripts/bootstrap-ci-npm.mjs
      - name: Install
        run: npm ci
      - name: Run all discovered tests in this shard
        run: npm run test:ci -- --shard=${{ matrix.shard }}/4

  browser:
    name: Browser acceptance (${{ matrix.phase }})
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        phase: [main, recovery, s3]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - name: Setup npm
        run: node scripts/bootstrap-ci-npm.mjs
      - name: Install
        run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser regression
        run: npm run test:e2e:${{ matrix.phase }}
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ matrix.phase }}
          path: |
            playwright-report/
            test-results/

  security:
    name: Complete dependency security scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - name: Setup npm
        run: node scripts/bootstrap-ci-npm.mjs
      - name: Install
        run: npm ci
      - name: Dependency security gate
        run: npm run audit:all

  verify:
    name: Verify public app
    needs: [health, tests, browser, security]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require every gate to succeed
        env:
          HEALTH_RESULT: ${{ needs.health.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          test "$HEALTH_RESULT" = success
          test "$TESTS_RESULT" = success
          test "$BROWSER_RESULT" = success
          test "$SECURITY_RESULT" = success

