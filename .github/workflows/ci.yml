name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: Static, build, and smoke
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pin npm
        run: npm install --global npm@12.0.1

      - name: Install dependencies
        run: npm ci

      - name: Run static verification and build
        run: npm run verify:static

      - name: Run route smoke checks
        run: npm run smoke:routes:budget

      - name: Run mobile route smoke checks
        run: npm run smoke:routes:mobile

      - name: Verify ordinary saved diagram recovery
        shell: pwsh
        env:
          PRECOMPILED_ROUTE_BASE_URL: http://127.0.0.1:4176
          DISPLAY_ROUTING_MATRIX_VIEWPORT: 1024x600
          DISPLAY_ROUTING_MATRIX_CASE: domain-lanes-tb
        run: |
          $savedPreview = Start-Process -FilePath (Get-Command node).Source -ArgumentList @(
            'node_modules/vite/bin/vite.js', 'preview', '--host', '127.0.0.1', '--port', '4176', '--strictPort'
          ) -WindowStyle Hidden -PassThru
          try {
            $ready = $false
            for ($attempt = 1; $attempt -le 60; $attempt += 1) {
              if ($savedPreview.HasExited) { throw 'Saved diagram preview exited before readiness.' }
              try {
                Invoke-WebRequest -Uri $env:PRECOMPILED_ROUTE_BASE_URL -UseBasicParsing -TimeoutSec 2 | Out-Null
                $ready = $true
                break
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw 'Saved diagram preview did not become ready.' }
            $env:DISPLAY_ROUTING_MATRIX_SAVED_RELOAD = 'initial'
            $env:DISPLAY_ROUTING_MATRIX_PRESET = 'wms-process-flow-v1'
            npm run verify:display-routing-matrix
            if ($LASTEXITCODE -ne 0) { throw 'WMS saved diagram recovery failed.' }
            $env:DISPLAY_ROUTING_MATRIX_SAVED_RELOAD = 'layout'
            $env:DISPLAY_ROUTING_MATRIX_PRESET = 'logistics-architecture-v1'
            $env:DISPLAY_ROUTING_MATRIX_WARM_CASES = 'domain-lanes-lr'
            npm run verify:display-routing-matrix
            if ($LASTEXITCODE -ne 0) { throw 'Saved layout switching failed.' }
          } finally {
            if (-not $savedPreview.HasExited) { Stop-Process -Id $savedPreview.Id -Force }
          }

  tests:
    name: Tests (${{ matrix.group }})
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: [foundation, ui, flow, core, routing]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pin npm
        run: npm install --global npm@12.0.1

      - name: Install dependencies
        run: npm ci

      - name: Verify test catalog
        run: npm run check:test-ci-coverage

      - name: Run test group
        run: node scripts/run-test-ci.mjs
        env:
          TEST_CI_GROUP: ${{ matrix.group }}
          TEST_CI_COVERAGE: 1

      - name: Upload shard coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.group }}
          path: coverage/shards
          if-no-files-found: error
          retention-days: 1

  coverage:
    name: Coverage thresholds
    needs: [tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pin npm
        run: npm install --global npm@12.0.1

      - name: Install dependencies
        run: npm ci

      - name: Download shard coverage
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage/shards
          merge-multiple: true

      - name: Merge coverage and enforce thresholds
        run: npm run test:coverage:merge

  verify:
    name: Verify and test
    if: ${{ always() }}
    needs: [static, tests, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every verification job
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          TEST_RESULT: ${{ needs.tests.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        run: |
          test "$STATIC_RESULT" = "success"
          test "$TEST_RESULT" = "success"
          test "$COVERAGE_RESULT" = "success"
