name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify and test
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run static verification
        run: npm run verify

      - name: Run CI test shards
        run: npm run test:ci

      - name: Run route smoke checks
        run: npm run smoke:routes:budget

      - name: Run mobile viewport route smoke checks
        run: npm run smoke:routes:mobile
