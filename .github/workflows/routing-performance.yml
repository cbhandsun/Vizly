name: Routing performance

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/routing-performance.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'src/core/components/custom-edges/**'
      - 'src/core/components/shared/**'
      - 'src/core/routing/**'
      - 'src/core/strategies/shared/**'
      - 'scripts/*display-routing*'
      - 'scripts/lib/display-routing-*'
      - 'scripts/lib/precompiled-display-route-*'
      - 'scripts/lib/routing-performance-*'
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      sample_count:
        description: Independent fresh-profile samples per benchmark
        required: true
        default: 30
        type: number

permissions:
  contents: read

concurrency:
  group: routing-performance-${{ github.ref }}
  cancel-in-progress: false

env:
  PRECOMPILED_ROUTE_BASE_URL: http://127.0.0.1:4174

jobs:
  cold-routing:
    name: Cold routing samples
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - name: Pin npm
        run: npm install --global npm@12.0.1

      - name: Install dependencies
        run: npm ci

      - name: Resolve bounded sample count
        shell: pwsh
        env:
          ROUTING_PERF_EVENT_NAME: ${{ github.event_name }}
          ROUTING_PERF_REQUESTED_SAMPLE_COUNT: ${{ inputs.sample_count }}
        run: |
          $sampleCount = node scripts/resolve-routing-performance-sample-count.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "ROUTING_PERF_SAMPLE_COUNT=$sampleCount" >> $env:GITHUB_ENV

      - name: Build production application
        run: npm run build

      - name: Start isolated production preview
        shell: pwsh
        run: |
          $preview = Start-Process -FilePath 'npm.cmd' -ArgumentList @(
            'run', 'preview', '--', '--host', '127.0.0.1', '--port', '4174', '--strictPort'
          ) -WindowStyle Hidden -PassThru
          "ROUTING_PREVIEW_PID=$($preview.Id)" >> $env:GITHUB_ENV
          for ($attempt = 1; $attempt -le 60; $attempt += 1) {
            if ($preview.HasExited) {
              throw "Production preview exited with code $($preview.ExitCode)."
            }
            try {
              Invoke-WebRequest -Uri $env:PRECOMPILED_ROUTE_BASE_URL -UseBasicParsing -TimeoutSec 2 | Out-Null
              exit 0
            } catch {
              Start-Sleep -Seconds 1
            }
          }
          throw 'Production preview did not become ready within 60 seconds.'

      - name: Run independent cold-route samples
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'artifacts/routing-performance' | Out-Null
          $env:DISPLAY_ROUTING_COLD_SAMPLE_COUNT = $env:ROUTING_PERF_SAMPLE_COUNT
          npm run benchmark:display-routing-cold 2>&1 |
            Tee-Object -FilePath 'artifacts/routing-performance/cold-routing.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stop production preview
        if: ${{ always() }}
        shell: pwsh
        run: |
          if ($env:ROUTING_PREVIEW_PID -match '^\d+$') {
            Stop-Process -Id ([int]$env:ROUTING_PREVIEW_PID) -Force -ErrorAction SilentlyContinue
          }

      - name: Upload cold-route report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: routing-performance-cold-${{ github.run_attempt }}
          path: |
            artifacts/routing-performance/cold-routing.txt
            artifacts/routing-performance/cold-*/samples.jsonl
          if-no-files-found: error
          retention-days: 30

  incremental-routing:
    name: Incremental routing samples
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - name: Pin npm
        run: npm install --global npm@12.0.1

      - name: Install dependencies
        run: npm ci

      - name: Resolve bounded sample count
        shell: pwsh
        env:
          ROUTING_PERF_EVENT_NAME: ${{ github.event_name }}
          ROUTING_PERF_REQUESTED_SAMPLE_COUNT: ${{ inputs.sample_count }}
        run: |
          $sampleCount = node scripts/resolve-routing-performance-sample-count.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "ROUTING_PERF_SAMPLE_COUNT=$sampleCount" >> $env:GITHUB_ENV

      - name: Build production application
        run: npm run build

      - name: Start isolated production preview
        shell: pwsh
        run: |
          $preview = Start-Process -FilePath 'npm.cmd' -ArgumentList @(
            'run', 'preview', '--', '--host', '127.0.0.1', '--port', '4174', '--strictPort'
          ) -WindowStyle Hidden -PassThru
          "ROUTING_PREVIEW_PID=$($preview.Id)" >> $env:GITHUB_ENV
          for ($attempt = 1; $attempt -le 60; $attempt += 1) {
            if ($preview.HasExited) {
              throw "Production preview exited with code $($preview.ExitCode)."
            }
            try {
              Invoke-WebRequest -Uri $env:PRECOMPILED_ROUTE_BASE_URL -UseBasicParsing -TimeoutSec 2 | Out-Null
              exit 0
            } catch {
              Start-Sleep -Seconds 1
            }
          }
          throw 'Production preview did not become ready within 60 seconds.'

      - name: Run independent incremental-route samples
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'artifacts/routing-performance' | Out-Null
          $env:DISPLAY_ROUTING_SAMPLE_COUNT = $env:ROUTING_PERF_SAMPLE_COUNT
          npm run benchmark:display-routing-browser 2>&1 |
            Tee-Object -FilePath 'artifacts/routing-performance/incremental-routing.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stop production preview
        if: ${{ always() }}
        shell: pwsh
        run: |
          if ($env:ROUTING_PREVIEW_PID -match '^\d+$') {
            Stop-Process -Id ([int]$env:ROUTING_PREVIEW_PID) -Force -ErrorAction SilentlyContinue
          }

      - name: Upload incremental-route report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: routing-performance-incremental-${{ github.run_attempt }}
          path: |
            artifacts/routing-performance/incremental-routing.txt
            artifacts/routing-performance/incremental-*/samples.jsonl
          if-no-files-found: error
          retention-days: 30

  interaction-paint:
    name: Interaction paint samples
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - name: Pin npm
        run: npm install --global npm@12.0.1

      - name: Install dependencies
        run: npm ci

      - name: Resolve bounded sample count
        shell: pwsh
        env:
          ROUTING_PERF_EVENT_NAME: ${{ github.event_name }}
          ROUTING_PERF_REQUESTED_SAMPLE_COUNT: ${{ inputs.sample_count }}
        run: |
          $sampleCount = node scripts/resolve-routing-performance-sample-count.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "ROUTING_PERF_SAMPLE_COUNT=$sampleCount" >> $env:GITHUB_ENV

      - name: Build production application
        run: npm run build

      - name: Start isolated production preview
        shell: pwsh
        run: |
          $preview = Start-Process -FilePath 'npm.cmd' -ArgumentList @(
            'run', 'preview', '--', '--host', '127.0.0.1', '--port', '4174', '--strictPort'
          ) -WindowStyle Hidden -PassThru
          "ROUTING_PREVIEW_PID=$($preview.Id)" >> $env:GITHUB_ENV
          for ($attempt = 1; $attempt -le 60; $attempt += 1) {
            if ($preview.HasExited) {
              throw "Production preview exited with code $($preview.ExitCode)."
            }
            try {
              Invoke-WebRequest -Uri $env:PRECOMPILED_ROUTE_BASE_URL -UseBasicParsing -TimeoutSec 2 | Out-Null
              exit 0
            } catch {
              Start-Sleep -Seconds 1
            }
          }
          throw 'Production preview did not become ready within 60 seconds.'

      - name: Run independent interaction-paint samples
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'artifacts/routing-performance' | Out-Null
          $reportPath = 'artifacts/routing-performance/interaction-paint.txt'
          for ($sample = 1; $sample -le [int]$env:ROUTING_PERF_SAMPLE_COUNT; $sample += 1) {
            "interaction-paint sample $sample/$env:ROUTING_PERF_SAMPLE_COUNT" |
              Tee-Object -FilePath $reportPath -Append
            $sampleSucceeded = $false
            for ($attempt = 1; $attempt -le 2; $attempt += 1) {
              $sampleOutput = node scripts/verify-display-routing-browser.mjs --interaction-only 2>&1
              $sampleOutput | Tee-Object -FilePath $reportPath -Append
              if ($LASTEXITCODE -eq 0) {
                $sampleSucceeded = $true
                break
              }
              $sampleText = $sampleOutput -join "`n"
              $retryableBrowserStartup = $sampleText -match 'Browser DevTools startup failed:.*"reason":"deadline".*"probeErrorCode":"ECONNREFUSED".*"processSpawned":true'
              $retryableBrowserNavigation = $sampleText -match 'CDP command timed out: Page\.navigate|Browser state wait failed.*"readyState":"loading"'
              if ((-not $retryableBrowserStartup -and -not $retryableBrowserNavigation) -or $attempt -eq 2) { exit $LASTEXITCODE }
              "interaction-paint sample $sample retrying after retryable browser startup/navigation failure" |
                Tee-Object -FilePath $reportPath -Append
              Start-Sleep -Seconds 2
            }
            if (-not $sampleSucceeded) { exit 1 }
          }
          $paintDurations = @()
          Get-Content $reportPath | Where-Object {
            $_.StartsWith('DISPLAY_ROUTING_INTERACTION_RESULT=')
          } | ForEach-Object {
            $payload = $_.Substring('DISPLAY_ROUTING_INTERACTION_RESULT='.Length)
            $result = $payload | ConvertFrom-Json
            foreach ($theme in @($result.themes)) {
              $paintDurations += [double]$theme.interactions.maximumPaintMs
            }
          }
          $expectedCount = [int]$env:ROUTING_PERF_SAMPLE_COUNT * 3
          if ($paintDurations.Count -ne $expectedCount) {
            throw "Expected $expectedCount interaction paint measurements but found $($paintDurations.Count)."
          }
          $sortedDurations = @($paintDurations | Sort-Object)
          $p95Index = [Math]::Max(0, [Math]::Ceiling($sortedDurations.Count * 0.95) - 1)
          $p95Ms = [double]$sortedDurations[$p95Index]
          $maxMs = [double]$sortedDurations[-1]
          "interaction-paint summary: count=$($sortedDurations.Count), p95Ms=$([Math]::Round($p95Ms, 1)), maxMs=$([Math]::Round($maxMs, 1)), budgetMs=100" |
            Tee-Object -FilePath $reportPath -Append
          if ($p95Ms -gt 100) {
            exit 1
          }

      - name: Stop production preview
        if: ${{ always() }}
        shell: pwsh
        run: |
          if ($env:ROUTING_PREVIEW_PID -match '^\d+$') {
            Stop-Process -Id ([int]$env:ROUTING_PREVIEW_PID) -Force -ErrorAction SilentlyContinue
          }

      - name: Upload interaction-paint report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: routing-performance-interaction-${{ github.run_attempt }}
          path: artifacts/routing-performance/interaction-paint.txt
          if-no-files-found: error
          retention-days: 30

